<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boeing 737 Overhead Static Preview</title>
  <style>
    :root {
      --panel-bg: #667078;
      --panel-bg-dark: #4d565d;
      --panel-bg-light: #7b858c;
      --engrave: #12181c;
      --label: #e6ecef;
      --amber: #ffb238;
      --blue: #4da6ff;
      --green: #64d46b;
      --white-lit: #f4f7ec;
      --red-guard: #c62828;
      --shadow: rgba(0, 0, 0, 0.55);
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 12%, rgba(255, 255, 255, 0.16), transparent 28%), linear-gradient(145deg, #15191d, #07090b 68%); color: var(--label); font-family: "DIN Condensed", "Arial Narrow", "Helvetica Neue Condensed", sans-serif; letter-spacing: 0.04em; overflow: auto; }
    .preview-wrap { padding: 36px; }
    .overhead-shell { width: 980px; height: 1040px; position: relative; border-radius: 10px 10px 42px 42px; background: linear-gradient(90deg, rgba(255,255,255,0.08), transparent 18%, rgba(0,0,0,0.16) 80%), repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 5px), var(--panel-bg); box-shadow: inset 0 0 0 3px #222a30, inset 0 0 36px rgba(255,255,255,0.08), 0 28px 70px rgba(0, 0, 0, 0.78); padding: 18px; }
    .overhead-shell::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.14; background-image: radial-gradient(circle at 12% 20%, #fff 0 0.7px, transparent 0.9px), radial-gradient(circle at 84% 72%, #000 0 0.8px, transparent 1px); background-size: 19px 23px, 17px 21px; mix-blend-mode: overlay; }
    .subpanel { position: absolute; padding: 10px 8px; border: 1px solid rgba(20, 28, 34, 0.92); background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(0,0,0,0.1)), var(--panel-bg-dark); box-shadow: inset 1px 1px 0 rgba(255,255,255,0.18), inset -2px -2px 5px rgba(0,0,0,0.32), 0 2px 6px rgba(0,0,0,0.24); }
    .panel-title { position: absolute; top: 4px; left: 0; right: 0; text-align: center; color: var(--engrave); font-size: 10px; font-weight: 800; text-shadow: 0 1px rgba(255,255,255,0.18); letter-spacing: 0.12em; }
    .label { color: var(--label); font-size: 8px; line-height: 1.05; text-align: center; text-shadow: 0 1px 1px #000; }
    .screw { position: absolute; width: 11px; height: 11px; border-radius: 50%; background: linear-gradient(135deg, #aab2b6, #4e565c 48%, #161b1f 52%, #788086); box-shadow: inset 0 0 2px #000, 0 1px 1px rgba(255,255,255,0.16); }
    .screw::after { content: ""; position: absolute; left: 2px; right: 2px; top: 5px; height: 1px; background: rgba(15,18,20,0.8); transform: rotate(-18deg); }
    .screw.tl { top: 6px; left: 6px; } .screw.tr { top: 6px; right: 6px; } .screw.bl { bottom: 6px; left: 6px; } .screw.br { bottom: 6px; right: 6px; }
    .hardware-row {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 8px;
      margin-top: 18px;
    }

    .hardware-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }

    .annunciator {
      min-width: 46px;
      height: 21px;
      display: grid;
      place-items: center;
      padding: 2px 4px;
      border: 1px solid #15191b;
      border-radius: 2px;
      background: linear-gradient(#171b1e, #050607);
      color: rgba(255,255,255,0.22);
      font-size: 7px;
      font-weight: 800;
      line-height: 0.95;
      text-align: center;
      box-shadow: inset 0 1px 4px #000, 0 1px 0 rgba(255,255,255,0.12);
    }

    .annunciator.amber.on {
      background: radial-gradient(circle at 50% 35%, #ffd98a, var(--amber) 55%, #8a4a00);
      color: #1e1405;
      box-shadow: inset 0 0 8px rgba(255,255,255,0.6), 0 0 10px rgba(255,178,56,0.45);
    }

    .annunciator.blue.on {
      background: radial-gradient(circle at 50% 35%, #b7ddff, var(--blue) 55%, #164a82);
      color: #07111d;
      box-shadow: inset 0 0 8px rgba(255,255,255,0.55), 0 0 10px rgba(77,166,255,0.45);
    }

    .annunciator.green.on {
      background: radial-gradient(circle at 50% 35%, #d5ffd8, var(--green) 55%, #1f6d27);
      color: #071707;
      box-shadow: inset 0 0 8px rgba(255,255,255,0.55), 0 0 10px rgba(100,212,107,0.4);
    }

    .toggle {
      width: 28px;
      height: 46px;
      position: relative;
      margin: 0 auto;
    }

    .toggle::before {
      content: "";
      position: absolute;
      left: 3px;
      right: 3px;
      top: 11px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle, #9ba4aa 0 33%, #363e44 60%, #111 100%);
      box-shadow: inset 0 0 4px #000;
    }

    .toggle::after {
      content: "";
      position: absolute;
      left: 10px;
      top: 5px;
      width: 8px;
      height: 32px;
      border-radius: 6px;
      background: linear-gradient(90deg, #7b7f80, #f5f2e8 40%, #989b98 75%, #3d4244);
      box-shadow: 0 5px 7px rgba(0,0,0,0.55);
      transform: rotate(var(--angle, 0deg));
      transform-origin: 50% 80%;
    }

    .toggle.down::after { top: 12px; transform: rotate(180deg); }
    .toggle.left::after { --angle: -18deg; }
    .toggle.right::after { --angle: 18deg; }

    .guarded-switch {
      width: 34px;
      height: 58px;
      position: relative;
      display: grid;
      place-items: center;
    }

    .guarded-switch::before {
      content: "";
      position: absolute;
      inset: 3px 5px;
      border-radius: 4px;
      background: linear-gradient(90deg, #8b1414, var(--red-guard), #5f0b0b);
      box-shadow: inset 0 0 5px rgba(255,255,255,0.22), 0 2px 5px rgba(0,0,0,0.5);
    }

    .guarded-switch::after {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      top: 7px;
      height: 44px;
      border: 2px solid rgba(255,255,255,0.22);
      border-top-color: rgba(255,255,255,0.5);
      border-radius: 4px;
    }

    .knob {
      width: 44px;
      height: 44px;
      position: relative;
      border-radius: 50%;
      background:
        radial-gradient(circle at 38% 32%, #c8ced1, #767f85 42%, #242b30 72%, #050607 100%);
      box-shadow: inset -3px -4px 7px rgba(0,0,0,0.6), inset 2px 2px 5px rgba(255,255,255,0.35), 0 2px 5px rgba(0,0,0,0.45);
    }

    .knob::after {
      content: "";
      position: absolute;
      left: 19px;
      top: 4px;
      width: 6px;
      height: 16px;
      border-radius: 3px;
      background: #161a1d;
      box-shadow: 0 0 1px #fff;
      transform: rotate(var(--angle, 0deg));
      transform-origin: 50% 18px;
    }

    .gauge {
      width: 78px;
      height: 78px;
      position: relative;
      border-radius: 50%;
      background:
        radial-gradient(circle, #111 0 48%, #2c3337 49% 58%, #9aa2a5 59% 63%, #101417 64%);
      box-shadow: inset 0 0 10px #000, 0 2px 5px rgba(0,0,0,0.55);
    }

    .gauge::before {
      content: "";
      position: absolute;
      inset: 13px;
      border-radius: 50%;
      background:
        conic-gradient(from -120deg, #dce3e4 0 4deg, transparent 4deg 24deg, #dce3e4 24deg 28deg, transparent 28deg 50deg, #dce3e4 50deg 54deg, transparent 54deg 240deg),
        #101214;
    }

    .gauge::after {
      content: "";
      position: absolute;
      left: 38px;
      top: 19px;
      width: 2px;
      height: 27px;
      background: #f2f2e8;
      box-shadow: 0 0 3px #fff;
      transform: rotate(var(--angle, 42deg));
      transform-origin: 50% 100%;
    }

    .seven-seg {
      min-width: 78px;
      height: 28px;
      padding: 4px 7px;
      border: 2px solid #22282b;
      border-radius: 3px;
      background: #10160f;
      color: #b8ff62;
      font-family: "Courier New", monospace;
      font-size: 18px;
      line-height: 1;
      text-align: center;
      letter-spacing: 0.08em;
      box-shadow: inset 0 0 9px #000, 0 0 6px rgba(184,255,98,0.15);
    }

    .switch-label {
      margin-top: 2px;
      color: var(--label);
      font-size: 7px;
      line-height: 0.95;
      text-align: center;
      text-shadow: 0 1px 1px #000;
      white-space: pre-line;
    }

    .engraved-box {
      border: 1px solid rgba(12,16,18,0.85);
      box-shadow: inset 1px 1px 0 rgba(255,255,255,0.13), inset -1px -1px 0 rgba(0,0,0,0.35);
      padding: 6px;
    }
  </style>
</head>
<body>
  <main class="preview-wrap" aria-label="Static preview of a Boeing 737 overhead panel">
    <section class="overhead-shell">
      <div class="subpanel elec"><div class="panel-title">ELECTRICAL</div><span class="screw tl"></span><span class="screw tr"></span><span class="screw bl"></span><span class="screw br"></span></div>
      <div class="subpanel fuel"><div class="panel-title">FUEL</div><span class="screw tl"></span><span class="screw tr"></span><span class="screw bl"></span><span class="screw br"></span></div>
      <div class="subpanel hyd"><div class="panel-title">HYDRAULIC</div><span class="screw tl"></span><span class="screw tr"></span><span class="screw bl"></span><span class="screw br"></span></div>
      <div class="subpanel window-heat"><div class="panel-title">WINDOW HEAT</div><span class="screw tl"></span><span class="screw tr"></span><span class="screw bl"></span><span class="screw br"></span></div>
      <div class="subpanel air-cond"><div class="panel-title">AIR COND</div><span class="screw tl"></span><span class="screw tr"></span><span class="screw bl"></span><span class="screw br"></span></div>
      <div class="subpanel bleed"><div class="panel-title">BLEED</div><span class="screw tl"></span><span class="screw tr"></span><span class="screw bl"></span><span class="screw br"></span></div>
      <div class="subpanel press"><div class="panel-title">PRESSURIZATION</div><span class="screw tl"></span><span class="screw tr"></span><span class="screw bl"></span><span class="screw br"></span></div>
      <div class="subpanel lights-left"><div class="panel-title">LIGHTS</div><span class="screw tl"></span><span class="screw tr"></span><span class="screw bl"></span><span class="screw br"></span></div>
      <div class="subpanel engine-start"><div class="panel-title">ENGINE START</div><span class="screw tl"></span><span class="screw tr"></span><span class="screw bl"></span><span class="screw br"></span></div>
      <div class="subpanel wipers"><div class="panel-title">WIPERS</div><span class="screw tl"></span><span class="screw tr"></span><span class="screw bl"></span><span class="screw br"></span></div>
    </section>
  </main>
</body>
</html>
